<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이벤트 — THE ROOT RN</title>
<meta name="description" content="THE ROOT RN 이벤트 캘린더. Career Stories, Clinical Lab, VHE 세션 일정.">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
:root{
  --bg:#EEEADE;--bg-alt:#E6E1D4;--white:#FEFCF8;
  --t1:#3A5840;--t2:#4E6B52;--t3:#8A9E7A;
  --green:#3A5840;--green-ghost:#EBF4ED;--green-lt:#74C48A;
  --gold:#8A8B3C;--gold-ghost:#F5F3E0;--bdrw:#D4CEC4;
  --forest:#2B4530;
  --r-sm:8px;--r-md:14px;--r-lg:20px;--r-xl:28px;
  --max:1000px;--g:24px;
}
body{font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;background:var(--bg);color:var(--t1);line-height:1.6;-webkit-font-smoothing:antialiased}
.fade{opacity:0;transform:translateY(12px);transition:opacity .6s ease-out,transform .6s ease-out}
.fade.in{opacity:1;transform:none}

/* NAV */
nav{position:sticky;top:0;z-index:100;height:56px;display:flex;align-items:center;background:rgba(238,234,222,0.88);backdrop-filter:blur(16px);border-bottom:1px solid var(--bdrw)}
.nav-inner{max-width:var(--max);margin:0 auto;padding:0 var(--g);width:100%;display:flex;align-items:center;justify-content:space-between}
.nav-logo{font-size:15px;font-weight:900;letter-spacing:0.04em;color:var(--t1);text-decoration:none;display:flex;align-items:baseline;gap:4px}
.nav-logo em{color:var(--gold);font-style:normal}
.nav-back{font-size:13px;color:var(--t3);text-decoration:none;transition:color .2s}
.nav-back:hover{color:var(--t1)}

/* HERO */
.hero{background:var(--forest);padding:76px var(--g) 68px;text-align:center}
.hero-inner{max-width:var(--max);margin:0 auto}
.hero-kicker{font-size:11px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:rgba(255,255,255,0.42);margin-bottom:18px}
.hero-h1{font-size:clamp(32px,5vw,52px);font-weight:800;letter-spacing:-0.04em;line-height:1.08;color:#fff;margin-bottom:16px}
.hero-h1 em{color:#A8D5B8;font-style:italic}
.hero-sub{font-size:16px;color:rgba(255,255,255,0.58);line-height:1.65;max-width:480px;margin:0 auto}

main{max-width:var(--max);margin:0 auto;padding:56px var(--g) 96px}

/* SECTION LABEL */
.sec-label{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.sec-label-text{font-size:11px;font-weight:700;letter-spacing:0.10em;text-transform:uppercase;color:var(--t3);white-space:nowrap}
.sec-label-line{flex:1;height:1px;background:var(--bdrw)}

/* LOADING */
.loading{text-align:center;padding:48px 24px;color:var(--t3);font-size:14px}
.loading-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--t3);margin:0 2px;animation:ld 1.2s ease-in-out infinite}
.loading-dot:nth-child(2){animation-delay:.15s}
.loading-dot:nth-child(3){animation-delay:.3s}
@keyframes ld{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* CALENDAR */
.calendar-wrap{margin-bottom:56px}
.cal-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.cal-month{background:var(--white);border:1px solid var(--bdrw);border-radius:var(--r-xl);padding:26px}
.cal-month-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;gap:12px}
.cal-month-name{font-size:16px;font-weight:800;letter-spacing:-0.02em;color:var(--t1)}
.cal-month-year{font-size:12px;color:var(--t3);font-weight:500}
.cal-legend{display:flex;flex-direction:column;gap:4px;flex-shrink:0}
.cal-legend-item{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--t3);font-weight:500;white-space:nowrap}
.cal-dot-cs{width:7px;height:7px;border-radius:50%;background:var(--gold);flex-shrink:0}
.cal-dot-vhe{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0}
.cal-days-header{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:5px}
.cal-day-name{font-size:10px;font-weight:700;color:var(--t3);text-align:center;padding:3px 0;letter-spacing:0.04em;text-transform:uppercase}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:var(--r-sm);font-size:13px;font-weight:500;color:var(--t2);position:relative;transition:background .15s}
.cal-day.empty{color:transparent}
.cal-day.today{background:var(--green-ghost);color:var(--t1);font-weight:700;box-shadow:inset 0 0 0 1.5px var(--green-lt)}
.cal-day.has-event{cursor:pointer;font-weight:700;color:var(--t1)}
.cal-day.has-event:hover{background:var(--bg-alt)}
.cal-day.past-event{opacity:0.42}
.cal-event-dot{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);display:flex;gap:2px}
.cal-event-dot span{width:5px;height:5px;border-radius:50%;display:block}
.dot-cs{background:var(--gold)}
.dot-vhe{background:var(--green)}

/* EVENT CARDS */
.events-list{display:flex;flex-direction:column;gap:18px;margin-bottom:56px}
.ev-card{background:var(--white);border:1px solid var(--bdrw);border-radius:var(--r-xl);overflow:hidden}
.ev-card-bar{display:flex;align-items:center;gap:10px;padding:13px 24px;border-bottom:1px solid var(--bdrw);flex-wrap:wrap}
.ev-type{font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:3px 10px;border-radius:99px}
.ev-type-cs{background:var(--gold-ghost);color:var(--gold);border:1px solid rgba(138,139,60,0.2)}
.ev-type-vhe{background:var(--green-ghost);color:var(--green);border:1px solid rgba(58,88,64,0.15)}
.ev-date-chip{font-size:12px;font-weight:600;color:var(--t3)}
.ev-status{margin-left:auto;font-size:10px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;padding:3px 9px;border-radius:99px}
.ev-status-open{background:#E8F5EC;color:#1F6B35;border:1px solid rgba(31,107,53,0.18)}
.ev-status-closed{background:#F5F0EA;color:#8A6A50;border:1px solid rgba(138,106,80,0.2)}
.ev-status-tease{background:#FFF8E6;color:#7A6020;border:1px solid rgba(138,139,60,0.22)}
.ev-status-past{background:var(--bg);color:var(--t3);border:1px solid var(--bdrw)}

.ev-body{display:grid;grid-template-columns:1fr 260px}
.ev-body.no-side{grid-template-columns:1fr}
.ev-left{padding:30px 32px 26px}
.ev-vol{font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--t3);margin-bottom:10px}
.ev-title{font-size:clamp(21px,3vw,30px);font-weight:800;color:var(--t1);letter-spacing:-0.03em;line-height:1.13;margin-bottom:4px}
.ev-title em{color:var(--gold);font-style:italic}
.ev-title-sub{font-size:clamp(15px,2vw,20px);font-weight:700;color:var(--t2);letter-spacing:-0.02em;opacity:0.75;margin-bottom:20px}
.ev-speaker{display:flex;align-items:center;gap:13px;margin-bottom:16px}
.ev-av{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--forest),#4E6B52);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;color:#fff;font-weight:700}
.ev-name{font-size:14px;font-weight:700;color:var(--t1)}
.ev-role{font-size:12px;color:var(--t3);line-height:1.4;margin-top:2px}
.ev-creds{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:24px}
.ev-cred{font-size:11px;font-weight:600;background:var(--green-ghost);color:var(--t1);padding:3px 9px;border-radius:6px}
.ev-btn{display:inline-flex;align-items:center;gap:8px;background:var(--green);color:#fff;padding:12px 24px;border-radius:var(--r-sm);font-size:14px;font-weight:700;text-decoration:none;transition:background .15s,transform .1s}
.ev-btn:hover{background:#2a4d38;transform:translateY(-1px)}
.ev-btn-ghost{display:inline-block;background:var(--bg);color:var(--t3);border:1px solid var(--bdrw);font-size:13px;font-weight:500;padding:10px 18px;border-radius:var(--r-sm)}

.ev-right{background:var(--forest);padding:30px 26px;display:flex;flex-direction:column;gap:18px;justify-content:center}
.ev-info-lbl{font-size:10px;font-weight:700;letter-spacing:0.10em;text-transform:uppercase;color:rgba(255,255,255,0.35);margin-bottom:5px}
.ev-info-val{font-size:16px;font-weight:700;color:#fff;line-height:1.25}
.ev-info-val em{font-style:italic;font-weight:400;color:rgba(255,255,255,0.55);font-size:12px;display:block;margin-top:3px}
.ev-divider{width:100%;height:1px;background:rgba(255,255,255,0.08)}
.ev-note-dark{font-size:11px;color:rgba(255,255,255,0.35);line-height:1.6}

/* Compact layout */
.ev-compact-inner{padding:26px 32px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}
.ev-compact-left{flex:1;min-width:200px}
.ev-compact-meta{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap}
.ev-compact-item{font-size:13px;color:var(--t3);display:flex;align-items:center;gap:5px}
.ev-compact-item strong{color:var(--t2);font-weight:600}
.ev-bigdate{text-align:right;flex-shrink:0}
.ev-bigdate-num{font-size:28px;font-weight:900;letter-spacing:-0.04em;line-height:1}
.ev-bigdate-num.cs{color:var(--gold)}
.ev-bigdate-num.vhe{color:var(--green)}
.ev-bigdate-lbl{font-size:12px;color:var(--t3);margin-top:4px}

/* Tease */
.ev-tease{background:var(--bg);border:1.5px dashed var(--bdrw)}
.ev-tease .ev-compact-left{opacity:0.72}
.ev-tease-badge{display:inline-flex;align-items:center;gap:7px;background:#FFF8E6;border:1px solid rgba(138,139,60,0.22);color:#7A6020;font-size:12px;font-weight:600;padding:7px 14px;border-radius:99px;margin-top:10px}

/* Past card */
.past-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.past-card{background:var(--white);border:1px solid var(--bdrw);border-radius:var(--r-lg);padding:22px 22px 18px;display:flex;flex-direction:column;gap:10px;opacity:0.86;transition:opacity .2s}
.past-card:hover{opacity:1}
.past-type{font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:2px 8px;border-radius:99px;align-self:flex-start}
.past-title{font-size:17px;font-weight:800;color:var(--t1);letter-spacing:-0.025em;line-height:1.2}
.past-sub{font-size:13px;color:var(--t3);line-height:1.5}
.past-speaker{font-size:12px;color:var(--t2);font-weight:600}
.past-date{font-size:12px;color:var(--t3);padding-top:8px;border-top:1px solid var(--bdrw);margin-top:auto}

.empty-state{background:var(--white);border:1.5px dashed var(--bdrw);border-radius:var(--r-xl);padding:44px 32px;text-align:center}
.empty-icon{font-size:1.9rem;margin-bottom:12px;opacity:0.35}
.empty-txt{font-size:15px;color:var(--t3);line-height:1.7}

/* Data source note */
.src-note{margin-top:44px;text-align:center;font-size:11px;color:var(--t3);opacity:0.55}

/* FOOTER */
footer{border-top:1px solid var(--bdrw);padding:36px var(--g)}
.footer-inner{max-width:var(--max);margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.footer-logo{font-size:14px;font-weight:900;letter-spacing:0.04em;color:var(--t1)}
.footer-logo em{color:var(--gold);font-style:normal}
.footer-copy{font-size:12px;color:var(--t3)}

@media(max-width:720px){
  .cal-grid{grid-template-columns:1fr}
  .ev-body{grid-template-columns:1fr}
  .ev-right{padding:24px 28px}
  .ev-left{padding:24px 24px 20px}
  .ev-compact-inner{flex-direction:column;align-items:flex-start}
  .ev-bigdate{text-align:left}
}
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a class="nav-logo" href="/">THE ROOT <em>RN</em></a>
    <a class="nav-back" href="/">← 홈으로</a>
  </div>
</nav>

<section class="hero">
  <div class="hero-inner">
    <div class="hero-kicker">THE ROOT RN · 이벤트</div>
    <h1 class="hero-h1">선배들의 여정을<br><em>직접</em> 들어요.</h1>
    <p class="hero-sub">Career Stories, Clinical Lab, VHE 세션 — 예정된 일정을 한눈에.</p>
  </div>
</section>

<main>

  <!-- CALENDAR -->
  <div class="sec-label fade">
    <span class="sec-label-text">📅 일정</span>
    <span class="sec-label-line"></span>
  </div>
  <div class="calendar-wrap fade">
    <div class="cal-grid" id="calGrid">
      <div class="loading"><span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span></div>
    </div>
  </div>

  <!-- UPCOMING -->
  <div class="sec-label fade">
    <span class="sec-label-text">🌱 다가오는 세션</span>
    <span class="sec-label-line"></span>
  </div>
  <div class="events-list" id="upcomingList">
    <div class="loading"><span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span></div>
  </div>

  <!-- PAST -->
  <div class="sec-label fade">
    <span class="sec-label-text">📂 지난 세션</span>
    <span class="sec-label-line"></span>
  </div>
  <div id="pastList"></div>

  <p class="src-note" id="srcNote"></p>

</main>

<footer>
  <div class="footer-inner">
    <div class="footer-logo">THE ROOT <em>RN</em></div>
    <div class="footer-copy">© 2026 Jennifer Minja Lee · All rights reserved</div>
  </div>
</footer>

<script>
/* ══════════════════════════════════════════════════
   ① 구글 시트 주소 — 여기 한 줄만 바꾸면 끝
   시트 → 파일 → 공유 → 웹에 게시 → CSV 선택 → 주소 복사
   ══════════════════════════════════════════════════ */
const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/1OrmDfwmJu4Q0UWrk4WGytSynVqZfp7jfqWkdWBONs_w/edit?usp=sharing';   // ← 여기에 CSV 주소를 붙여넣으세요

/* ══════════════════════════════════════════════════
   ② FALLBACK — 시트를 못 읽을 때 보여줄 기본 데이터
   시트가 정상이면 이건 무시돼요. 안전장치예요.
   ══════════════════════════════════════════════════ */
const FALLBACK = [
  {date:'2026-07-18',type:'cs',layout:'full',vol:'Vol. 1',title:'Dream BIG',subtitle:'Practice Bigger',
   speaker_name:'Jooha Park',speaker_role:'Electrophysiology Nurse Practitioner · UCLA Health',
   speaker_creds:'MSN|APRN|FNP-BC|CCRN-CMC|CSC',
   time_us:'July 18 (Sat) 4:00 PM PDT',time_kr:'July 19 (Sun) 8:00 AM KST',
   format:'Live Webinar · Zoom · 60분',seats:'20명 선정',close_date:'2026-07-10',
   cta_text:'신청하기',cta_link:'https://forms.gle/t8VV3WGMnoypFwcg8',
   note:'신청서 검토 후 선정된 분께 개별 안내 드려요.',publish:'yes'},
  {date:'2026-07-22',type:'vhe',layout:'compact',title:'VHE 멘티 세션',subtitle:'Sophia와 함께',
   format:'멘티 전용 세션 · Zoom · 소그룹',note:'초대 전용 세션',publish:'yes'},
  {date:'2026-08-01',type:'cs',layout:'tease',vol:'Vol. 2',title:'Career Stories #2',
   subtitle:'게스트 · 주제 · 신청 방법 공개 예정',
   note:'7월 20일에 공개돼요 — 인스타 팔로우하고 기다려요',publish:'yes'},
  {date:'2026-08-22',type:'vhe',layout:'compact',title:'Clinical Lab 첫 세션',
   subtitle:'미국 병동 임상 케이스 라이브',
   speaker_name:'Jennifer Minja Lee',speaker_role:'California RN · THE ROOT RN',
   format:'Live Session · Zoom',note:'자세한 내용 곧 공개해요',publish:'yes'}
];

/* ── CSV 파서 (따옴표·줄바꿈 처리) ── */
function parseCSV(text){
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i],n=text[i+1];
    if(q){
      if(c==='"'&&n==='"'){cell+='"';i++}
      else if(c==='"'){q=false}
      else cell+=c;
    } else {
      if(c==='"')q=true;
      else if(c===','){row.push(cell);cell=''}
      else if(c==='\r'){}
      else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell=''}
      else cell+=c;
    }
  }
  if(cell!==''||row.length){row.push(cell);rows.push(row)}
  if(!rows.length)return[];
  const head=rows[0].map(h=>h.trim().toLowerCase());
  return rows.slice(1)
    .filter(r=>r.some(c=>c.trim()!==''))
    .map(r=>{const o={};head.forEach((h,i)=>o[h]=(r[i]||'').trim());return o});
}

/* ── 날짜 유틸 ── */
function d(str){const p=String(str).trim().split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function todayMidnight(){const t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate())}

/* ── 상태 자동 판정 ── */
function statusOf(s){
  const today=todayMidnight();
  const ev=d(s.date);
  if(ev<today)return{key:'past',label:'지난 세션',cls:'ev-status-past'};
  if(s.layout==='tease')return{key:'tease',label:'공개 예정',cls:'ev-status-tease'};
  if(s.close_date&&d(s.close_date)<today)return{key:'closed',label:'신청 마감',cls:'ev-status-closed'};
  if(s.cta_link)return{key:'open',label:'신청 중',cls:'ev-status-open'};
  return{key:'soon',label:'예정',cls:'ev-status-past'};
}

const TYPE_LABEL={cs:'Career Stories',vhe:'VHE'};
const MONTH_EN=['January','February','March','April','May','June','July','August','September','October','November','December'];
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ── 카드 렌더 ── */
function renderCard(s){
  const st=statusOf(s);
  const dt=d(s.date);
  const dateStr=`${MONTH_EN[dt.getMonth()]} ${dt.getDate()}, ${dt.getFullYear()}`;
  const bar=`
    <div class="ev-card-bar">
      <span class="ev-type ev-type-${s.type}">${TYPE_LABEL[s.type]||s.type}</span>
      <span class="ev-date-chip">${dateStr}</span>
      <span class="ev-status ${st.cls}">${st.label}</span>
    </div>`;

  /* FULL layout — 게스트·시간·좌석 다 있는 큰 카드 */
  if(s.layout==='full'){
    const creds=(s.speaker_creds||'').split('|').filter(Boolean)
      .map(c=>`<span class="ev-cred">${esc(c)}</span>`).join('');
    const cta = st.key==='closed'||st.key==='past'
      ? `<span class="ev-btn-ghost">신청이 마감되었어요</span>`
      : (s.cta_link?`<a href="${esc(s.cta_link)}" target="_blank" class="ev-btn">${esc(s.cta_text||'신청하기')} →</a>`:'');
    return `<div class="ev-card fade" id="ev-${s.date}">${bar}
      <div class="ev-body">
        <div class="ev-left">
          ${s.vol?`<div class="ev-vol">${esc(s.vol)}</div>`:''}
          <div class="ev-title">${esc(s.title)}</div>
          ${s.subtitle?`<div class="ev-title-sub">${esc(s.subtitle)}</div>`:''}
          ${s.speaker_name?`<div class="ev-speaker">
            <div class="ev-av">👩‍⚕️</div>
            <div><div class="ev-name">${esc(s.speaker_name)}</div>
            <div class="ev-role">${esc(s.speaker_role)}</div></div>
          </div>`:''}
          ${creds?`<div class="ev-creds">${creds}</div>`:''}
          ${cta}
        </div>
        <div class="ev-right">
          ${s.time_us?`<div><div class="ev-info-lbl">🇺🇸 미국 시간</div><div class="ev-info-val">${esc(s.time_us)}</div></div>`:''}
          ${s.time_kr?`<div><div class="ev-info-lbl">🇰🇷 한국 시간</div><div class="ev-info-val">${esc(s.time_kr)}</div></div>`:''}
          <div class="ev-divider"></div>
          ${s.format?`<div><div class="ev-info-lbl">Format</div><div class="ev-info-val">${esc(s.format)}</div></div>`:''}
          ${s.seats?`<div><div class="ev-info-lbl">Seats</div><div class="ev-info-val">${esc(s.seats)}${s.close_date?`<em>모집 마감 ${esc(s.close_date)}</em>`:''}</div></div>`:''}
          ${s.note?`<div class="ev-note-dark">${esc(s.note)}</div>`:''}
        </div>
      </div></div>`;
  }

  /* TEASE layout — 아직 공개 안 된 세션 */
  if(s.layout==='tease'){
    return `<div class="ev-card ev-tease fade" id="ev-${s.date}">${bar}
      <div class="ev-body no-side"><div class="ev-compact-inner">
        <div class="ev-compact-left">
          ${s.vol?`<div class="ev-vol">${esc(s.vol)}</div>`:''}
          <div class="ev-title" style="font-size:20px">${esc(s.title)}</div>
          ${s.subtitle?`<div class="ev-title-sub" style="font-size:15px;margin:4px 0 0">${esc(s.subtitle)}</div>`:''}
          ${s.note?`<div class="ev-tease-badge">🔒 ${esc(s.note)}</div>`:''}
        </div>
        <div class="ev-bigdate">
          <div class="ev-bigdate-num ${s.type}">${dt.getMonth()+1}.${dt.getDate()}</div>
          <div class="ev-bigdate-lbl">${MONTH_EN[dt.getMonth()]} ${dt.getDate()}</div>
        </div>
      </div></div></div>`;
  }

  /* COMPACT layout — 기본 */
  const meta=[
    `🗓 <strong>${MONTH_EN[dt.getMonth()]} ${dt.getDate()}</strong>`,
    s.format?`💻 <strong>${esc(s.format)}</strong>`:''
  ].filter(Boolean).map(m=>`<div class="ev-compact-item">${m}</div>`).join('');
  const cta = s.cta_link&&st.key!=='past'&&st.key!=='closed'
    ? `<a href="${esc(s.cta_link)}" target="_blank" class="ev-btn">${esc(s.cta_text||'신청하기')} →</a>`
    : (s.note?`<span class="ev-btn-ghost">${esc(s.note)}</span>`:'');
  return `<div class="ev-card fade" id="ev-${s.date}">${bar}
    <div class="ev-body no-side"><div class="ev-compact-inner">
      <div class="ev-compact-left">
        <div class="ev-title" style="font-size:20px">${esc(s.title)}</div>
        ${s.subtitle?`<div class="ev-title-sub" style="font-size:15px;margin:4px 0 0">${esc(s.subtitle)}</div>`:''}
        ${s.speaker_name?`<div style="font-size:13px;color:var(--t2);font-weight:600;margin-top:8px">${esc(s.speaker_name)}${s.speaker_role?` · <span style="font-weight:400;color:var(--t3)">${esc(s.speaker_role)}</span>`:''}</div>`:''}
        <div class="ev-compact-meta">${meta}</div>
      </div>
      ${cta}
    </div></div></div>`;
}

/* ── 지난 세션 카드 ── */
function renderPastCard(s){
  const dt=d(s.date);
  return `<div class="past-card fade">
    <span class="past-type ev-type-${s.type}">${TYPE_LABEL[s.type]||s.type}</span>
    <div class="past-title">${esc(s.title)}</div>
    ${s.subtitle?`<div class="past-sub">${esc(s.subtitle)}</div>`:''}
    ${s.speaker_name?`<div class="past-speaker">${esc(s.speaker_name)}</div>`:''}
    <div class="past-date">${MONTH_EN[dt.getMonth()]} ${dt.getDate()}, ${dt.getFullYear()}</div>
  </div>`;
}

/* ── 달력 렌더 ── */
function renderCalendars(sessions){
  const today=todayMidnight();
  const base=new Date(today.getFullYear(),today.getMonth(),1);
  const months=[base,new Date(base.getFullYear(),base.getMonth()+1,1)];

  /* 다가오는 세션이 2개월 밖에 있으면 그 달도 포함 */
  const future=sessions.filter(s=>d(s.date)>=today).sort((a,b)=>d(a.date)-d(b.date));
  if(future.length){
    const last=d(future[future.length-1].date);
    const lastKey=last.getFullYear()*12+last.getMonth();
    const secondKey=months[1].getFullYear()*12+months[1].getMonth();
    if(lastKey>secondKey)months[1]=new Date(last.getFullYear(),last.getMonth(),1);
  }

  const html=months.map(m=>{
    const y=m.getFullYear(),mo=m.getMonth();
    const firstDow=new Date(y,mo,1).getDay();
    const daysIn=new Date(y,mo+1,0).getDate();
    const byDay={};
    sessions.forEach(s=>{const dt=d(s.date);if(dt.getFullYear()===y&&dt.getMonth()===mo){(byDay[dt.getDate()]=byDay[dt.getDate()]||[]).push(s)}});

    let cells='';
    for(let i=0;i<firstDow;i++)cells+=`<div class="cal-day empty">·</div>`;
    for(let day=1;day<=daysIn;day++){
      const evs=byDay[day];
      const isToday=(y===today.getFullYear()&&mo===today.getMonth()&&day===today.getDate());
      let cls='cal-day';
      if(isToday)cls+=' today';
      if(evs){
        cls+=' has-event';
        if(new Date(y,mo,day)<today)cls+=' past-event';
      }
      const dots=evs?`<div class="cal-event-dot">${evs.map(e=>`<span class="dot-${e.type}"></span>`).join('')}</div>`:'';
      const target=evs?` data-jump="ev-${evs[0].date}"`:'';
      cells+=`<div class="${cls}"${target}>${day}${dots}</div>`;
    }
    return `<div class="cal-month">
      <div class="cal-month-header">
        <div><div class="cal-month-name">${MONTH_EN[mo]}</div><div class="cal-month-year">${y}</div></div>
        <div class="cal-legend">
          <div class="cal-legend-item"><span class="cal-dot-cs"></span>Career Stories</div>
          <div class="cal-legend-item"><span class="cal-dot-vhe"></span>VHE · Clinical Lab</div>
        </div>
      </div>
      <div class="cal-days-header">
        <div class="cal-day-name">Su</div><div class="cal-day-name">Mo</div><div class="cal-day-name">Tu</div>
        <div class="cal-day-name">We</div><div class="cal-day-name">Th</div><div class="cal-day-name">Fr</div><div class="cal-day-name">Sa</div>
      </div>
      <div class="cal-days">${cells}</div>
    </div>`;
  }).join('');

  document.getElementById('calGrid').innerHTML=html;

  /* 날짜 클릭 → 카드로 스크롤 */
  document.querySelectorAll('[data-jump]').forEach(el=>{
    el.addEventListener('click',()=>{
      const t=document.getElementById(el.dataset.jump);
      if(t)t.scrollIntoView({behavior:'smooth',block:'center'});
    });
  });
}

/* ── 전체 렌더 ── */
function render(sessions,source){
  const clean=sessions
    .filter(s=>s.date&&s.title)
    .filter(s=>String(s.publish||'yes').toLowerCase()!=='no')
    .map(s=>({...s,type:(s.type||'cs').toLowerCase(),layout:(s.layout||'compact').toLowerCase()}))
    .sort((a,b)=>d(a.date)-d(b.date));

  renderCalendars(clean);

  const upcoming=clean.filter(s=>statusOf(s).key!=='past');
  const past=clean.filter(s=>statusOf(s).key==='past').reverse();

  document.getElementById('upcomingList').innerHTML = upcoming.length
    ? upcoming.map(renderCard).join('')
    : `<div class="empty-state"><div class="empty-icon">🌱</div>
       <p class="empty-txt">지금은 예정된 세션이 없어요.<br>새 일정이 정해지면 여기에 올라와요.</p></div>`;

  document.getElementById('pastList').innerHTML = past.length
    ? `<div class="past-grid">${past.map(renderPastCard).join('')}</div>`
    : `<div class="empty-state"><div class="empty-icon">🌱</div>
       <p class="empty-txt">아직 지난 세션이 없어요.<br>첫 세션이 끝나면 여기에 기록될 거예요.</p></div>`;

  document.getElementById('srcNote').textContent =
    source==='sheet' ? '일정은 실시간으로 업데이트돼요.' : '';

  /* fade 재적용 */
  const io=new IntersectionObserver(es=>es.forEach(e=>{
    if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}
  }),{threshold:0.06});
  document.querySelectorAll('.fade:not(.in)').forEach(el=>io.observe(el));
}

/* ── 시트 로드 (실패하면 FALLBACK) ── */
(async function(){
  if(SHEET_CSV_URL){
    try{
      const res=await fetch(SHEET_CSV_URL,{cache:'no-store'});
      if(!res.ok)throw new Error('fetch failed');
      const rows=parseCSV(await res.text());
      const valid=rows.filter(r=>r.date&&r.title);
      if(valid.length){
        render(valid,'sheet');
        /* 홈 스트립 등에서 재사용할 수 있게 저장 */
        try{sessionStorage.setItem('rootSessions',JSON.stringify(valid))}catch(e){}
        return;
      }
    }catch(e){
      console.warn('시트를 읽지 못해 기본 데이터를 사용해요:',e);
    }
  }
  render(FALLBACK,'fallback');
})();
</script>
