<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jennifer's Nursing Brain Sheet</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:#e5e5e5;font-family:'Arial',sans-serif;
  min-height:100vh;display:flex;flex-direction:column;
  align-items:center;padding:30px 16px 50px;
}
.page{
  background:#fff;width:100%;max-width:680px;
  box-shadow:0 2px 20px rgba(0,0,0,0.15);
  padding:24px 28px 20px;
}
h1{
  text-align:center;font-size:22px;font-weight:900;
  letter-spacing:0.06em;color:#111;
  margin-bottom:16px;text-transform:uppercase;
}
table{width:100%;border-collapse:collapse;table-layout:fixed;}
table+table{margin-top:-1.5px;}
td{border:1.5px solid #555;vertical-align:middle;}
.lbl{
  background:#e8e8e8;font-weight:700;font-size:12px;
  color:#111;text-align:center;padding:5px 6px;
  overflow-wrap:break-word;
}
.inp{background:#fff;padding:0;}
.inp input,.inp textarea{
  width:100%;border:none;outline:none;
  font-family:'Arial',sans-serif;font-size:12.5px;
  color:#111;background:transparent;
  padding:5px 7px;resize:none;overflow:hidden;line-height:1.5;
}
.inp input{height:28px;}
.inp textarea{min-height:28px;}
.inp input::placeholder,.inp textarea::placeholder{color:#bbb;font-size:11px;}
.tall textarea{min-height:64px;}
.vtall textarea{min-height:90px;}
.actions{
  margin-top:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
}
.btn{
  padding:8px 22px;border-radius:5px;font-size:13px;
  font-weight:700;cursor:pointer;border:none;font-family:'Arial',sans-serif;
}
.btn-print{background:#1a1a1a;color:#fff;}
.btn-print:hover{background:#333;}
.btn-clear{background:#fff;color:#555;border:1.5px solid #ccc;}
.btn-clear:hover{background:#f5f5f5;}

@media print{
  body{background:#fff;padding:0;}
  .page{box-shadow:none;max-width:100%;padding:10px;}
  .actions{display:none;}
  .lbl{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
}
</style>
</head>
<body>
<div class="page">
  <h1>Nursing Report Sheet</h1>

  <!-- 상단 정보 영역: 왼쪽(라벨+입력)은 좁게, 오른쪽 Lab/Test는 넓게 -->
  <table>
    <tr>
      <td class="lbl" style="width:21%">Room</td>
      <td class="inp" style="width:29%"><input placeholder=""></td>
      <td class="lbl" style="width:25%">Doctor</td>
      <td class="inp" style="width:25%"><input placeholder=""></td>
    </tr>
    <tr>
      <td class="lbl">Name</td>
      <td class="inp"><input placeholder=""></td>
      <td class="lbl" rowspan="2">Consulting</td>
      <td class="inp" rowspan="2"><textarea placeholder=""></textarea></td>
    </tr>
    <tr>
      <td class="lbl">Age/Gender</td>
      <td class="inp"><input placeholder=""></td>
    </tr>
    <tr>
      <td class="lbl">CC</td>
      <td class="inp"><input placeholder=""></td>
      <td class="lbl">Lab</td>
      <td class="lbl">Test</td>
    </tr>
    <tr>
      <td class="lbl">Dx</td>
      <td class="inp"><input placeholder=""></td>
      <td class="inp tall" rowspan="4"><textarea placeholder=""></textarea></td>
      <td class="inp tall" rowspan="4"><textarea placeholder=""></textarea></td>
    </tr>
    <tr>
      <td class="lbl">PMHx</td>
      <td class="inp"><input placeholder=""></td>
    </tr>
    <tr>
      <td class="lbl">Allergy</td>
      <td class="inp"><input placeholder=""></td>
    </tr>
    <tr>
      <td class="lbl">Code</td>
      <td class="inp"><input placeholder=""></td>
    </tr>
    <tr>
      <td class="lbl">Accommodation</td>
      <td class="inp"><input placeholder=""></td>
      <td class="lbl">Vital sign</td>
      <td class="lbl">GI/Diet</td>
    </tr>
    <tr>
      <td class="lbl">Transfer from</td>
      <td class="inp"><input placeholder=""></td>
      <td class="inp vtall" rowspan="2"><textarea placeholder=""></textarea></td>
      <td class="inp vtall" rowspan="2"><textarea placeholder=""></textarea></td>
    </tr>
    <tr>
      <td class="lbl">Admission Date</td>
      <td class="inp"><input placeholder=""></td>
    </tr>
  </table>

  <!-- 하단 시스템별 영역: 4칸 균등 -->
  <table>
    <tr>
      <td class="lbl" style="width:25%">Neuro</td>
      <td class="lbl" style="width:25%">Respiratory</td>
      <td class="lbl" style="width:25%">Cardiac</td>
      <td class="lbl" style="width:25%">GU</td>
    </tr>
    <tr>
      <td class="inp tall"><textarea placeholder=""></textarea></td>
      <td class="inp tall"><textarea placeholder=""></textarea></td>
      <td class="inp tall"><textarea placeholder=""></textarea></td>
      <td class="inp tall"><textarea placeholder=""></textarea></td>
    </tr>
    <tr>
      <td class="lbl">Muscular</td>
      <td class="lbl">VTE</td>
      <td class="lbl">IV</td>
      <td class="lbl">Skin/Wound</td>
    </tr>
    <tr>
      <td class="inp tall"><textarea placeholder=""></textarea></td>
      <td class="inp tall"><textarea placeholder=""></textarea></td>
      <td class="inp tall"><textarea placeholder=""></textarea></td>
      <td class="inp tall"><textarea placeholder=""></textarea></td>
    </tr>
    <tr>
      <td class="lbl" colspan="2">Note</td>
      <td class="lbl">Plan</td>
      <td class="lbl">Discharge to</td>
    </tr>
    <tr>
      <td class="inp" colspan="2"><textarea style="min-height:110px"></textarea></td>
      <td class="inp"><textarea style="min-height:110px"></textarea></td>
      <td class="inp"><textarea style="min-height:110px"></textarea></td>
    </tr>
  </table>

  <div style="text-align:right;margin-top:8px;font-size:11px;color:#888;font-style:italic;">
    by Jennifer Minja Lee
  </div>

  <div class="actions">
    <button class="btn btn-print" onclick="window.print()">🖨 Print / Save PDF</button>
    <button class="btn btn-clear" onclick="clearAll()">Clear All</button>
  </div>
</div>

<script>
function clearAll(){
  if(!confirm('모든 입력 내용을 지울까요?'))return;
  document.querySelectorAll('input,textarea').forEach(el=>el.value='');
  document.querySelectorAll('textarea').forEach(ta=>{ta.style.height='auto';});
}
document.querySelectorAll('textarea').forEach(ta=>{
  ta.addEventListener('input',function(){
    this.style.height='auto';
    this.style.height=this.scrollHeight+'px';
  });
});
</script>
</body>
</html>
